<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141814"/>
      <stop offset="100%" stop-color="#0a0d0a"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); stroke: #2d382d; stroke-width: 2; rx: 8; }
    .tab-rect { fill: #1c241c; stroke: #395239; stroke-width: 1.5; rx: 4; }
    .tab-label { font-family: monospace; font-size: 12px; fill: #7a997a; font-weight: bold; }

    .term-title { font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; }
    .term-desc { font-family: 'Courier New', monospace; font-size: 13px; fill: #b0cbb0; }
    .term-code { font-family: monospace; font-size: 12px; fill: #ffffff; }

    /* Painéis de conteúdo: cada um visível por 6s dentro de um ciclo de 18s */
    .content-panel {
      opacity: 0;
      animation: cyclePanel 18s infinite;
    }
    #content-fullstack { animation-delay: 0s; }
    #content-infra     { animation-delay: 6s; }
    #content-auto      { animation-delay: 12s; }

    @keyframes cyclePanel {
      0%    { opacity: 0; }
      2%    { opacity: 1; }
      4%    { opacity: 0.4; }
      6%    { opacity: 1; }
      31%   { opacity: 1; }
      33%   { opacity: 0; }
      100%  { opacity: 0; }
    }

    /* Abas acompanham o painel ativo */
    #tab-fullstack .tab-rect  { animation: tabActiveGreen 18s infinite; }
    #tab-fullstack .tab-label { animation: tabLabelGreen 18s infinite; }

    #tab-infra .tab-rect  { animation: tabActiveOrange 18s infinite; }
    #tab-infra .tab-label { animation: tabLabelOrange 18s infinite; }

    #tab-auto .tab-rect  { animation: tabActiveRed 18s infinite; }
    #tab-auto .tab-label { animation: tabLabelRed 18s infinite; }

    @keyframes tabActiveGreen {
      0%   { fill: #2d452d; stroke: #39ff14; }
      32%  { fill: #2d452d; stroke: #39ff14; }
      34%  { fill: #1c241c; stroke: #395239; }
      100% { fill: #1c241c; stroke: #395239; }
    }
    @keyframes tabLabelGreen {
      0%   { fill: #39ff14; }
      32%  { fill: #39ff14; }
      34%  { fill: #7a997a; }
      100% { fill: #7a997a; }
    }

    @keyframes tabActiveOrange {
      0%   { fill: #1c241c; stroke: #395239; }
      33%  { fill: #1c241c; stroke: #395239; }
      35%  { fill: #382d1a; stroke: #ffaa00; }
      65%  { fill: #382d1a; stroke: #ffaa00; }
      67%  { fill: #1c241c; stroke: #395239; }
      100% { fill: #1c241c; stroke: #395239; }
    }
    @keyframes tabLabelOrange {
      0%   { fill: #7a997a; }
      33%  { fill: #7a997a; }
      35%  { fill: #ffaa00; }
      65%  { fill: #ffaa00; }
      67%  { fill: #7a997a; }
      100% { fill: #7a997a; }
    }

    @keyframes tabActiveRed {
      0%   { fill: #1c241c; stroke: #395239; }
      66%  { fill: #1c241c; stroke: #395239; }
      68%  { fill: #381c1c; stroke: #ff4444; }
      98%  { fill: #381c1c; stroke: #ff4444; }
      100% { fill: #1c241c; stroke: #395239; }
    }
    @keyframes tabLabelRed {
      0%   { fill: #7a997a; }
      66%  { fill: #7a997a; }
      68%  { fill: #ff4444; }
      98%  { fill: #ff4444; }
      100% { fill: #7a997a; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content-panel, .tab-rect, .tab-label { animation: none !important; }
      #content-fullstack { opacity: 1; }
      #tab-fullstack .tab-rect { fill: #2d452d; stroke: #39ff14; }
      #tab-fullstack .tab-label { fill: #39ff14; }
    }
  </style>

  <!-- Fundo do Terminal -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- NAVBAR DE ABAS -->
  <g id="tabs-nav">
    <g id="tab-fullstack">
      <rect x="25" y="20" width="200" height="34" class="tab-rect"/>
      <text x="125" y="42" text-anchor="middle" class="tab-label">[ FULL-STACK ]</text>
    </g>

    <g id="tab-infra">
      <rect x="240" y="20" width="200" height="34" class="tab-rect"/>
      <text x="340" y="42" text-anchor="middle" class="tab-label">[ INFRAESTRUTURA ]</text>
    </g>

    <g id="tab-auto">
      <rect x="455" y="20" width="220" height="34" class="tab-rect"/>
      <text x="565" y="42" text-anchor="middle" class="tab-label">[ AUTOMAÇÃO IND. ]</text>
    </g>
  </g>

  <line x1="25" y1="68" x2="825" y2="68" stroke="#2d382d" stroke-width="1.5"/>

  <!-- PAINEL 1: FULL-STACK -->
  <g id="content-fullstack" class="content-panel">
    <text x="35" y="95" fill="#39ff14" class="term-title">&gt; DESENVOLVIMENTO FULL-STACK</text>
    <text x="35" y="120" class="term-desc">Sistemas web e de linha de comando com foco em performance e confiabilidade.</text>
    <rect x="35" y="138" width="780" height="92" rx="4" fill="#0f140f" stroke="#1d2b1d"/>
    <text x="50" y="162" class="term-code"><tspan fill="#39ff14">BACKEND:</tspan>  Rust (Axum, Tokio) · Node.js · TypeScript</text>
    <text x="50" y="185" class="term-code"><tspan fill="#39ff14">FRONTEND:</tspan> React · TypeScript · APIs REST</text>
    <text x="50" y="208" class="term-code"><tspan fill="#39ff14">LOW-CODE:</tspan> Power Apps · Power BI · Power Automate</text>
  </g>

  <!-- PAINEL 2: INFRAESTRUTURA -->
  <g id="content-infra" class="content-panel">
    <text x="35" y="105" fill="#ffaa00" class="term-title">&gt; INFRAESTRUTURA &amp; VIRTUALIZAÇÃO</text>
    <text x="35" y="135" class="term-desc">Administração de servidores, clusters e ambientes virtualizados em produção.</text>
    <rect x="35" y="155" width="780" height="75" rx="4" fill="#14110b" stroke="#33240e"/>
    <text x="50" y="180" class="term-code"><tspan fill="#ffaa00">VIRT/CLOUD:</tspan> Proxmox · VMware · Hyper-V · Microsoft Azure</text>
    <text x="50" y="205" class="term-code"><tspan fill="#ffaa00">OS/REDES:</tspan>  Linux · Bash · PowerShell · VLANs · Firewall</text>
  </g>

  <!-- PAINEL 3: AUTOMAÇÃO INDUSTRIAL -->
  <g id="content-auto" class="content-panel">
    <text x="35" y="105" fill="#ff4444" class="term-title">&gt; AUTOMAÇÃO &amp; ELETRÔNICA EMBARCADA</text>
    <text x="35" y="135" class="term-desc">Sistemas embarcados, controle industrial e integração de hardware.</text>
    <rect x="35" y="155" width="780" height="75" rx="4" fill="#170c0c" stroke="#3d1414"/>
    <text x="50" y="180" class="term-code"><tspan fill="#ff4444">HARDWARE:</tspan> ESP32 · Arduino · C/C++ · Rust Embarcado · Sensores</text>
    <text x="50" y="205" class="term-code"><tspan fill="#ff4444">PROTOCOLOS:</tspan> HART · Foundation FieldBus · Modbus · CLP/PLC</text>
  </g>
</svg>
