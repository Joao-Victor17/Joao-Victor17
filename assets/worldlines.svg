<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141814"/>
      <stop offset="100%" stop-color="#0a0d0a"/>
    </linearGradient>
  </defs>
  
  <style>
    /* Estilos Básicos */
    .bg { fill: url(#bgGrad); stroke: #2d382d; stroke-width: 2; rx: 8; }
    .tab-btn { cursor: pointer; }
    .tab-rect { fill: #1c241c; stroke: #395239; stroke-width: 1.5; rx: 4; transition: all 0.2s ease; }
    .tab-label { font-family: monospace; font-size: 12px; fill: #7a997a; font-weight: bold; pointer-events: none; transition: fill 0.2s ease; }
    
    /* Telas de Conteúdo */
    .content-panel { opacity: 0; transition: opacity 0.25s ease-in-out; pointer-events: none; }
    .term-title { font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; }
    .term-desc { font-family: 'Courier New', monospace; font-size: 13px; fill: #b0cbb0; }
    .term-code { font-family: monospace; font-size: 12px; fill: #ffffff; }

    /* Estado Inicial: Steins;Gate visível por padrão */
    #content-sg { opacity: 1; }
    #tab-sg .tab-rect { fill: #2d452d; stroke: #39ff14; }
    #tab-sg .tab-label { fill: #39ff14; }

    /* SE O MOUSE ESTIVER SOBRE ALPHA OU BETA: DESLIGA O BOTÃO STEINS;GATE */
    #tabs-nav:has(#tab-alpha:hover) #tab-sg .tab-rect,
    #tabs-nav:has(#tab-beta:hover) #tab-sg .tab-rect {
      fill: #1c241c;
      stroke: #395239;
    }
    #tabs-nav:has(#tab-alpha:hover) #tab-sg .tab-label,
    #tabs-nav:has(#tab-beta:hover) #tab-sg .tab-label {
      fill: #7a997a;
    }

    /* HOVER NA ABA 1: STEINS;GATE */
    #tab-sg:hover .tab-rect { fill: #2d452d; stroke: #39ff14; }
    #tab-sg:hover .tab-label { fill: #39ff14; }

    /* HOVER NA ABA 2: ALPHA */
    #tab-alpha:hover .tab-rect { fill: #382d1a; stroke: #ffaa00; }
    #tab-alpha:hover .tab-label { fill: #ffaa00; }
    #tabs-nav:has(#tab-alpha:hover) ~ #content-alpha { opacity: 1; }
    #tabs-nav:has(#tab-alpha:hover) ~ #content-sg { opacity: 0; }

    /* HOVER NA ABA 3: BETA */
    #tab-beta:hover .tab-rect { fill: #381c1c; stroke: #ff4444; }
    #tab-beta:hover .tab-label { fill: #ff4444; }
    #tabs-nav:has(#tab-beta:hover) ~ #content-beta { opacity: 1; }
    #tabs-nav:has(#tab-beta:hover) ~ #content-sg { opacity: 0; }
  </style>

  <!-- Fundo do Terminal -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- GRUPO NAVEGADOR DE ABAS -->
  <g id="tabs-nav">
    <!-- Aba 1: Steins;Gate -->
    <g id="tab-sg" class="tab-btn">
      <rect x="25" y="20" width="220" height="34" class="tab-rect"/>
      <text x="135" y="42" text-anchor="middle" class="tab-label">[ 1.048596% STEINS;GATE ]</text>
    </g>

    <!-- Aba 2: Alpha -->
    <g id="tab-alpha" class="tab-btn">
      <rect x="260" y="20" width="200" height="34" class="tab-rect"/>
      <text x="360" y="42" text-anchor="middle" class="tab-label">[ 0.571024% ALPHA ]</text>
    </g>

    <!-- Aba 3: Beta -->
    <g id="tab-beta" class="tab-btn">
      <rect x="475" y="20" width="200" height="34" class="tab-rect"/>
      <text x="575" y="42" text-anchor="middle" class="tab-label">[ 1.130205% BETA ]</text>
    </g>
  </g>

  <line x1="25" y1="68" x2="825" y2="68" stroke="#2d382d" stroke-width="1.5"/>

  <!-- PAINEL 1: STEINS;GATE (PRODUÇÃO & ARQUITETURA) -->
  <g id="content-sg" class="content-panel">
    <text x="35" y="105" fill="#39ff14" class="term-title">&gt; DIRETIVA ATUAL: SISTEMAS ESCALÁVEIS &amp; PRODUÇÃO</text>
    <text x="35" y="135" class="term-desc">Foco na estabilidade da linha do tempo. Microsserviços e infraestrutura distribuída.</text>
    <rect x="35" y="155" width="780" height="75" rx="4" fill="#0f140f" stroke="#1d2b1d"/>
    <text x="50" y="180" class="term-code"><tspan fill="#ffaa00">CORE STACK:</tspan> Node.js, Python, TypeScript</text>
    <text x="50" y="205" class="term-code"><tspan fill="#ffaa00">INFRA &amp; EDGE:</tspan> Cloudflare Workers &amp; Pages, Vercel Serverless, Docker</text>
  </g>

  <!-- PAINEL 2: ALPHA (BAIXO NÍVEL & AUTOMAÇÃO) -->
  <g id="content-alpha" class="content-panel">
    <text x="35" y="105" fill="#ffaa00" class="term-title">&gt; EXPERIMENTOS: PROTOCOLOS, WORKFLOWS &amp; HARDWARE</text>
    <text x="35" y="135" class="term-desc">Rotinas automatizadas de CI/CD e exploração de sistemas embarcados.</text>
    <rect x="35" y="155" width="780" height="75" rx="4" fill="#14110b" stroke="#33240e"/>
    <text x="50" y="180" class="term-code"><tspan fill="#ffaa00">AUTOMAÇÃO:</tspan> GitHub Actions Workflows, Webhooks, Scripts Bash/Python</text>
    <text x="50" y="205" class="term-code"><tspan fill="#ffaa00">INTEGRAÇÕES:</tspan> Protocolos Seriais, Microcontroladores e IOT</text>
  </g>

  <!-- PAINEL 3: BETA (ANALÍTICO & ALGORITMOS) -->
  <g id="content-beta" class="content-panel">
    <text x="35" y="105" fill="#ff4444" class="term-title">&gt; MODELAGEM MATEMÁTICA &amp; COMPUTAÇÃO CIENTÍFICA</text>
    <text x="35" y="135" class="term-desc">Estruturas de dados complexas, análise quantitativa e simulações analíticas.</text>
    <rect x="35" y="155" width="780" height="75" rx="4" fill="#170c0c" stroke="#3d1414"/>
    <text x="50" y="180" class="term-code"><tspan fill="#ff4444">ANALÍTICO:</tspan> Otimização de Consultas SQL, Análise de Dados e Simulações Físicas</text>
    <text x="50" y="205" class="term-code"><tspan fill="#ff4444">ESTRUTURAS:</tspan> Algoritmos de Busca, Grafos e Performance em Tempo Real</text>
  </g>
</svg>
